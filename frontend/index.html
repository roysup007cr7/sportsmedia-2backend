<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Media</title>
  <style>
    :root {
      --pitch: #0a1118;
      --card: #111b24;
      --line: #1e2c3a;
      --text: #f0f4f8;
      --muted: #8a99ad;
      --flood: #f59e0b;
      --accent: #3b82f6;
      --radius-s: 8px;
      --radius-m: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--pitch); color: var(--text); line-height: 1.5; padding-bottom: 40px; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; color: inherit; }
    .btn { background: var(--line); border: none; padding: 8px 16px; border-radius: var(--radius-s); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-weight: 500; transition: .2s; }
    .btn:hover { opacity: .9; }
    .btn.primary { background: var(--flood); color: #000; }
    .btn.sm { font-size: .85rem; padding: 6px 12px; }
    .btn.disabled { opacity: 0.5; cursor: not-allowed; }
    .header { background: rgba(10, 17, 24, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
    .brand-badge { background: var(--flood); color: #000; padding: 4px 8px; border-radius: 6px; font-size: 0.9rem; }
    .nav { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
    .nav-item { padding: 6px 12px; border-radius: var(--radius-s); font-size: .9rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .nav-item.active, .nav-item:hover { color: var(--text); background: var(--line); }
    .controls { display: flex; gap: 8px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px; cursor: pointer; transition: transform .2s, border-color .2s; }
    .card:hover { transform: translateY(-2px); border-color: var(--muted); }
    .badge { font-size: .75rem; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; font-weight: 700; display: inline-block; }
    .badge.live { background: #ef4444; color: #fff; }
    .badge.upcoming { background: #3b82f6; color: #fff; }
    .badge.finished { background: var(--muted); color: #fff; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
    .overlay.active { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-m); width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); }
    .player { position: relative; padding-top: 56.25%; background: #000; border-radius: var(--radius-s); overflow: hidden; margin: 12px 0; }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .player .hold { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; color: var(--muted); }
    .ad { background: rgba(255,255,255,0.02); border: 1px dashed var(--line); text-align: center; padding: 20px; margin: 16px 0; border-radius: var(--radius-s); color: var(--muted); font-size: .8rem; }
    .share { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .field { display: block; margin-bottom: 12px; }
    .field span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
    .field input, .field textarea { width: 100%; background: var(--pitch); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 8px 12px; color: var(--text); }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand"><span class="brand-badge">SM</span> Sports Media</div>
    <div class="controls">
      <button class="btn sm" id="btnSearch">🔍</button>
      <button class="btn sm" id="btnRefresh">🔄</button>
      <button class="btn sm" id="btnSettings">⚙️</button>
    </div>
  </header>

  <div class="container">
    <nav class="nav">
      <div class="nav-item active" data-nav="home">Home</div>
      <div class="nav-item" data-nav="live">Live matches</div>
      <div class="nav-item" data-nav="next">Next matches</div>
      <div class="nav-item" data-nav="leagues">Leagues</div>
      <div class="nav-item" data-nav="football">Football</div>
      <div class="nav-item" data-nav="cricket">Cricket</div>
      <div class="nav-item" data-nav="news">Sports news</div>
      <div class="nav-item" data-nav="about">About</div>
      <div class="nav-item" data-nav="contact">Contact</div>
    </nav>

    <div class="ad" data-label="Ad space · header">Ad space · header</div>

    <div id="mainContent">
      <h2 style="margin-top:20px;">Live now</h2>
      <div class="grid" id="matchGrid"></div>
    </div>
  </div>

  <!-- Match Overlay Modal -->
  <div class="overlay" id="matchModal">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 id="mTitle">Match Details</h2>
      <div id="mBody"></div>
    </div>
  </div>

  <!-- Search Modal -->
  <div class="overlay" id="searchModal">
    <div class="modal" style="max-width:500px;">
      <button class="modal-close" onclick="closeOverlay('searchModal')">&times;</button>
      <h2>Search Matches</h2>
      <label class="field" style="margin-top:12px;">
        <input type="text" id="searchInput" placeholder="Search team or league...">
      </label>
      <div class="grid" id="searchResults" style="grid-template-columns:1fr;"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="overlay" id="settingsModal">
    <div class="modal" style="max-width:400px;">
      <button class="modal-close" onclick="closeOverlay('settingsModal')">&times;</button>
      <h2>Settings</h2>
      <p style="color:var(--muted); margin-top:12px;">Timezone: <strong id="tzVal">Local Time</strong></p>
    </div>
  </div>

  <script>
    const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
    let matchesData = [];

    const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    const badge = status => `<span class="badge ${status.toLowerCase()}">${esc(status)}</span>`;
    const fmtTime = utc => new Date(utc).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const fmtDay = utc => new Date(utc).toLocaleDateString([], {month: 'short', day:'numeric'});
    const countdown = utc => {
      const diff = new Date(utc) - new Date();
      if(diff <= 0) return 'Starting soon';
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      return `in ${h}h ${m}m`;
    };

    async function api(path) {
      try {
        const res = await fetch(path);
        if(!res.ok) throw new Error();
        return await res.json();
      } catch(e) {
        return null;
      }
    }

    function findMatch(id) {
      return matchesData.find(m => String(m.id) === String(id));
    }

    function openOverlay(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeOverlay(id) {
      document.getElementById(id).classList.remove('active');
    }

    async function loadMatches() {
      const data = await api('/public/matches');
      matchesData = data || [
        { id: '1', homeTeam: 'Real Madrid', awayTeam: 'Barcelona', status: 'LIVE', leagueName: 'La Liga', kickoffUtc: new Date().toISOString(), streamUrl: '', extStream1: 'https://google.com' },
        { id: '2', homeTeam: 'Arsenal', awayTeam: 'Chelsea', status: 'UPCOMING', leagueName: 'Premier League', kickoffUtc: new Date(Date.now()+7200000).toISOString() }
      ];
      renderGrid(matchesData);
    }

    function renderGrid(list) {
      const grid = document.getElementById('matchGrid');
      if(!list.length) {
        grid.innerHTML = '<p style="color:var(--muted);">No matches found.</p>';
        return;
      }
      grid.innerHTML = list.map(m => `
        <div class="card" onclick="openMatch('${m.id}')">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            ${badge(m.status)}
            <span style="font-size:.8rem; color:var(--muted);">${esc(m.leagueName||'')}</span>
          </div>
          <div style="font-weight:600; font-size:1.05rem;">${esc(m.homeTeam)} vs ${esc(m.awayTeam)}</div>
          <div style="font-size:.85rem; color:var(--muted); margin-top:8px;">
            ${fmtDay(m.kickoffUtc)} · ${fmtTime(m.kickoffUtc)}
          </div>
        </div>
      `).join('');
    }

    async function openMatch(id){
      let m = findMatch(id);
      try{ m = await api('/public/matches/'+id) || m; }catch(e){}
      if(!m) return;
      document.getElementById('mTitle').textContent = `${m.homeTeam} vs ${m.awayTeam}`;
      const live = m.status==='LIVE';
      const player = live && m.streamUrl
        ? `<div class="player"><iframe src="${esc(m.streamUrl)}" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="origin" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe></div>`
        : `<div class="player"><div class="hold">${live
            ? 'The stream link for this match has not been added yet. Try the refresh button in a minute.'
            : m.status==='FINISHED' ? 'This match has finished.' :
              `Starts ${fmtDay(m.kickoffUtc)} at ${fmtTime(m.kickoffUtc)} ·${countdown(m.kickoffUtc)}`}</div></div>`;

      const backups = m.backupStreams || m.extraStreams || [];
      const servers = backups.length
        ? `<div class="share" style="margin-top:12px">${backups.map((s,i)=>
            `<button class="btn sm" data-server="${esc(s.url \vert{}\vert{} s.streamUrl \vert{}\vert{} s)}">${esc(s.label || s.name || ('Server '+(i+2)))}</button>`).join('')}</div>` : '';

      const fixUrl = u => {
        if (!u) return '';
        u = String(u).trim();
        if (!u || u === '#' || u === 'null' || u === 'undefined') return '';
        return /^https?:\/\//i.test(u) ? u : 'https://' + u;
      };

      const ext1 = fixUrl(m.extStream1 || m.ext_stream1);
      const ext2 = fixUrl(m.extStream2 || m.ext_stream2);
      const ext3 = fixUrl(m.extStream3 || m.ext_stream3);

      const externalStreamSpots = `
        <div style="margin-top:16px; padding:12px; background:var(--pitch); border:1px solid var(--line); border-radius:var(--radius-s);">
          <div style="font-weight:600; font-size:.88rem; margin-bottom:8px; color:var(--flood);">🔗 External Streaming Links (Redirect)</div>
          <div class="share">
            ${ext1 ? `<a class="btn sm primary" href="${esc(ext1)}" target="_blank" rel="noopener">Stream 1 ↗</a>` : `<span class="btn sm disabled">Stream 1 (Offline)</span>`}
            ${ext2 ? `<a class="btn sm primary" href="${esc(ext2)}" target="_blank" rel="noopener">Stream 2 ↗</a>` : `<span class="btn sm disabled">Stream 2 (Offline)</span>`}
            ${ext3 ? `<a class="btn sm primary" href="${esc(ext3)}" target="_blank" rel="noopener">Stream 3 ↗</a>` : `<span class="btn sm disabled">Stream 3 (Offline)</span>`}
          </div>
        </div>`;

      document.getElementById('mBody').innerHTML = `
        ${player}
        ${servers}
        ${externalStreamSpots}
        <div style="display:flex;justify-content:space-between;margin:14px 0;color:var(--muted);font-size:.88rem">
          <span>${badge(m.status)} ${esc(m.leagueName||'')}</span>
          <span>${fmtDay(m.kickoffUtc)} · ${fmtTime(m.kickoffUtc)}</span>
        </div>`;

      openOverlay('matchModal');
    }

    // UI Event Listeners
    document.getElementById('modalClose').addEventListener('click', ()=>closeOverlay('matchModal'));
    document.getElementById('btnSearch').addEventListener('click', ()=>openOverlay('searchModal'));
    document.getElementById('btnRefresh').addEventListener('click', ()=>loadMatches());
    document.getElementById('btnSettings').addEventListener('click', ()=>{
      document.getElementById('tzVal').textContent = TZ;
      openOverlay('settingsModal');
    });

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        const nav = item.dataset.nav;
        if(nav === 'about') {
          document.getElementById('mainContent').innerHTML = '<h2>About Us</h2><p style="margin-top:10px; color:var(--muted);">Sports Media live sports portal.</p>';
        } else if(nav === 'contact') {
          document.getElementById('mainContent').innerHTML = '<h2>Contact Us</h2><p style="margin-top:10px; color:var(--muted);">Support email: support@sportsmedia.app</p>';
        } else {
          document.getElementById('mainContent').innerHTML = '<h2 style="margin-top:20px;">Matches</h2><div class="grid" id="matchGrid"></div>';
          loadMatches();
        }
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = matchesData.filter(m => 
        m.homeTeam.toLowerCase().includes(q) || 
        m.awayTeam.toLowerCase().includes(q) || 
        (m.leagueName && m.leagueName.toLowerCase().includes(q))
      );
      document.getElementById('searchResults').innerHTML = filtered.map(m => `
        <div class="card" onclick="closeOverlay('searchModal'); openMatch('${m.id}');">
          <strong>${esc(m.homeTeam)} vs ${esc(m.awayTeam)}</strong>
        </div>
      `).join('');
    });

    // Init
    loadMatches();
  </script>
</body>
</html>
